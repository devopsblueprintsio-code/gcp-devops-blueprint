name: "Python Build Template"
description: "Isolates Python requirements within a sandboxed virtualenv structure."

inputs:
  command:
    description: "Main build or compileall automation execution string."
    required: false
    default: "python -m compileall . --exclude .venv"

runs:
  using: "composite"
  steps:
    - name: Configure Isolated Virtual Environment
      shell: bash
      run: |
        python -m pip install --upgrade pip
        [ -d .venv ] && rm -rf .venv
        python -m venv .venv
        source .venv/bin/activate
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Python Artifact Processing
      shell: bash
      run: |
        source .venv/bin/activate
        ${{ inputs.command }}
