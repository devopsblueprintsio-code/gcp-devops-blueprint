name: "Generic Cloud Run Deployer"
description: "Deploys a containerized application to Google Cloud Run using Workload Identity Federation natively."

inputs:
  project-id:
    description: "Target Google Cloud Project ID."
    required: true
  service-name:
    description: "The name of the Cloud Run service to create or update."
    required: true
  registry-region:
    description: "GCP region hosting Artifact Registry (e.g., us-central1)."
    required: false
    default: "us-central1"
  repository-name:
    description: "Name of the Artifact Registry repository."
    required: true
  deploy-region:
    description: "GCP region where the Cloud Run resource will be provisioned."
    required: false
    default: "us-central1"

runs:
  using: "composite"
  steps:
    - name: Execute Serverless Deployment
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
        SERVICE_NAME: ${{ inputs.service-name }}
        REGION: ${{ inputs.deploy-region }}
      run: |
        set -euo pipefail

        echo "📦 Preparing Cloud Run deployment for service: $SERVICE_NAME"

        # 1. Gather dynamic metadata from Git reference context
        REPO_NAME_ONLY="$(basename "${{ github.repository }}")"
        SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c 1-7)
        CLEAN_REF="$(echo "${{ github.ref_name }}" | tr '/' '-')"
        TAG_NAME="${SHORT_SHA}-${CLEAN_REF}"

        # 2. Reconstruct the fully-qualified Artifact Registry image path URL using generic enterprise structures
        REGISTRY_HOST="${{ inputs.registry-region }}-docker.pkg.dev"
        IMAGE_BASE_URL="$REGISTRY_HOST/$PROJECT_ID/${{ inputs.repository-name }}/$REPO_NAME_ONLY"
        CI_IMAGE_URI="$(echo "$IMAGE_BASE_URL:$TAG_NAME" | tr '[:upper:]' '[:lower:]')"

        echo "🐳 Target Deploy Image: $CI_IMAGE_URI"
        echo "🚀 Executing gcloud run deploy..."

        # 3. Clean native Google Cloud Run execution deployment command string
        gcloud run deploy "$SERVICE_NAME" \
          --image="$CI_IMAGE_URI" \
          --region="$REGION" \
          --project="$PROJECT_ID" \
          --allow-unauthenticated \
          --platform="managed" \
          --quiet

        echo "✅ Cloud Run deployment finalized successfully."
