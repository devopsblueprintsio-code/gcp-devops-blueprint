name: "Golang Build Template"
description: "Compiles a Golang application enforcing aggressive workspace module caching."

inputs:
  command:
    description: "Main build command execution string."
    required: false
    default: "go build -v -o app main.go"
  go-version:
    description: "Target Go version environment."
    required: false
    default: "1.24"

runs:
  using: "composite"
  steps:
    - name: Ensure GNU tar Compatibility
      shell: bash
      run: |
        set +e
        if tar --posix -cf /tmp/test.tar --files-from /dev/null 2>/dev/null; then
          rm -f /tmp/test.tar && exit 0
        fi
        if command -v apk >/dev/null 2>&1; then apk add --no-cache tar;
        elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y tar; fi

    - name: Set up Go Runtime Environment
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Compute Go Module Cache Key
      id: cache-key
      shell: bash
      run: echo "key=${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum', '**/go.mod') }}" >> "$GITHUB_OUTPUT"

    - name: Restore Go Module Workspace Cache
      uses: actions/cache/restore@v4
      id: cache-restore
      with:
        path: .go/pkg/mod
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-go-mod-

    - name: Execute Golang Compilation
      shell: bash
      run: |
        export GOMODCACHE="$PWD/.go/pkg/mod"
        go mod tidy
        ${{ inputs.command }}

    - name: Save Go Module Workspace Cache
      if: steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .go/pkg/mod
        key: ${{ steps.cache-key.outputs.key }}
